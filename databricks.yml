# Rituals Radar - Databricks bundle (infrastructure as code).
# Deploy with:   databricks bundle deploy
# Run with:      databricks bundle run rituals_radar_refresh
#
# Bundles were renamed "Declarative Automation Bundles" in 2026 (formerly
# "Databricks Asset Bundles"); the CLI commands are the same.

bundle:
  name: rituals-radar

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog. In Databricks Free Edition this is "workspace".
    default: workspace
  schema:
    description: Schema for all tables and the landing volume. If you change it, also update config/radar.toml and the dashboard queries.
    default: rituals_radar
  warehouse_id:
    description: SQL warehouse that runs the dashboard queries.
    lookup:
      warehouse: Serverless Starter Warehouse
  include_sample_data:
    description: '"true" keeps the generated sample rows in silver/gold, "false" uses real data only (then do a full refresh).'
    default: "true"
  sentiment_engine:
    description: '"ai" = Databricks ai_analyze_sentiment(), "lexicon" = built-in word-list fallback.'
    default: "ai"

targets:
  free:
    default: true
    # No "mode: development" on purpose: development mode pauses all schedules,
    # and this project is meant to keep running on its own.
    workspace:
      host: https://REPLACE-WITH-YOUR-WORKSPACE.cloud.databricks.com
