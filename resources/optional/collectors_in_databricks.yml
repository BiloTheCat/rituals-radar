# OPTIONAL - run the collectors as Databricks jobs instead of GitHub Actions.
#
# Only works when your workspace can reach the websites/APIs (run the notebook
# src/notebooks/00_check_connectivity first; Free Edition blocks most sites
# unless outbound access is unlocked, e.g. via LinkedIn verification).
#
# To enable: move this file one folder up (to resources/), disable the GitHub
# Actions schedule, and run `databricks bundle deploy`.
# Note: Free Edition allows max 5 concurrent job tasks; these jobs use 1 each.
resources:
  jobs:
    rituals_radar_collect_stock:
      name: rituals-radar-collect-stock
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 15 0/3 * * ?"  # every 3 hours
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: collect_stock
          notebook_task:
            notebook_path: ../src/notebooks/03_run_collectors.py
            base_parameters:
              command: stock

    rituals_radar_collect_catalog:
      name: rituals-radar-collect-catalog
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 45 5 * * ?"  # daily 05:45 UTC
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: collect_catalog
          notebook_task:
            notebook_path: ../src/notebooks/03_run_collectors.py
            base_parameters:
              command: catalog

    rituals_radar_collect_reference:
      name: rituals-radar-collect-reference
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 30 4 ? * MON"  # Mondays 04:30 UTC
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: collect_reference
          notebook_task:
            notebook_path: ../src/notebooks/03_run_collectors.py
            base_parameters:
              command: reference
