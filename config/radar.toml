# Rituals Radar configuration
# ---------------------------------------------------------------------------
# Everything the collectors do is driven by this file. Secrets (API keys,
# tokens) never go here: they are read from environment variables, which come
# from GitHub secrets when the collectors run in GitHub Actions.

[landing]
# Unity Catalog volume created by the bundle (resources/infra.yml).
# Override per run with --out ./some_local_folder (handy for testing).
volume_path = "/Volumes/workspace/rituals_radar/landing"

[site]
base_url = "https://www.rituals.com"
locale = "nl-nl"
# Seconds between two requests to rituals.com. Be gentle: it's someone else's shop.
delay_seconds = 3.0
timeout_seconds = 20
# Identify yourself honestly (your GitHub repo).
user_agent = "RitualsRadar/1.0 (non-commercial portfolio project; +https://github.com/BiloTheCat/rituals-radar)"
respect_robots_txt = true

[watchlist]
# What to track. Two ways, which can be combined:
#
# 1. collections: follow EVERY product of a collection. Products are looked up in
#    the sitemap on each run, so new items in the collection are picked up
#    automatically and removed items drop out.
#    The current Limited Edition (the "Limited Edition" link in the rituals.com
#    menu, checked 13 Nov 2026) is the Uukumwe Collection. When Rituals launches
#    the next limited edition, add its keyword under [collections] below and
#    put that key here.
collections = ["uukumwe"]

# 2. products: individual product URLs (copy them from your browser) or the
#    7-digit number at the end of the URL. Examples you could add back:
#      "https://www.rituals.com/nl-nl/premium-advent-calendar-2026-1121936.html",
#      "https://www.rituals.com/nl-nl/classic-advent-calendar-2026-1121933.html",
products = []

# Hard limit on product pages per run (≈ max_products × delay_seconds seconds).
max_products = 40

# ---------------------------------------------------------------------------
# Collections (product lines). Keywords are matched as whole words in the
# product name/URL, so "sakura" does not match "yozakura". The FIRST matching
# collection in this file wins.
# ---------------------------------------------------------------------------
[collections.advent]
display_name = "Advent calendars"
keywords = ["advent", "advent calendar", "adventskalender", "adventkalender"]

[collections.yozakura]
display_name = "The Ritual of Yozakura"
keywords = ["yozakura"]

